<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B5E3C" />
  <title>Offline – Furniva Modern Furniture</title>
  <style>
    :root {
      --bg: #F7F4EF;
      --surface: #FFFFFF;
      --heading: #2C2723;
      --body: #5E574F;
      --muted: #8C827A;
      --accent: #8B5E3C;
      --accent-hover: #724C30;
      --border: #DED7CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151311;
        --surface: #1E1B18;
        --heading: #F7F4EF;
        --body: #D6CEC5;
        --muted: #9E948A;
        --accent: #D4A373;
        --accent-hover: #E5B585;
        --border: #36302B;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--body);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8B5E3C 0%, #4A301D 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(139, 94, 60, 0.25);
    }
    .icon-badge svg {
      width: 36px;
      height: 36px;
      stroke: #FFFFFF;
    }
    h1 {
      color: var(--heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: var(--body);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(217, 119, 6, 0.12);
      color: #D97706;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div>
      <span class="status-badge">No Internet Connection</span>
    </div>

    <h1>You Are Currently Offline</h1>

    <p>
      Furniva requires an active connection to fetch real-time catalog prices, stock availability, and checkout services.
      Please check your Wi-Fi or mobile data and try again.
    </p>

    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>

    <p class="footer-note">
      Cached catalog items and previously loaded pages may still be viewable.
    </p>
  </div>
</body>
</html>
