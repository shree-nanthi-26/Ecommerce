# ──────────────────────────────────────────────────────────────────────────────
# Furniva — Nginx Reverse Proxy Configuration
# ──────────────────────────────────────────────────────────────────────────────
#
# PM2 cluster workers all listen on the same port (5000) via SO_REUSEPORT,
# so Nginx only needs a single upstream entry. PM2's built-in cluster load
# balancer distributes connections to workers.
#
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/furniva
#   2. ln -s /etc/nginx/sites-available/furniva /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# For Windows (development), install Nginx via:
#   winget install nginx
#   Copy this file to <nginx-dir>/conf/nginx.conf
# ──────────────────────────────────────────────────────────────────────────────

# ── Worker tuning ────────────────────────────────────────────────────────────
worker_processes auto;             # Match CPU cores
worker_rlimit_nofile 65535;        # Per-worker file descriptor limit

events {
    worker_connections 4096;       # Max connections per worker
    multi_accept on;               # Accept all pending connections at once
    use epoll;                     # Linux high-performance event model
}

http {
    # ── Basic settings ───────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;       # Reuse connections up to 1000 requests
    types_hash_max_size 2048;
    client_max_body_size 10M;      # Max upload size (match multer config)

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/furniva-access.log;
    error_log  /var/log/nginx/furniva-error.log warn;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;
    gzip_vary on;
    gzip_proxied any;

    # ── Rate Limiting (Layer 1 — before hitting Node.js) ─────────────────────
    # 50 requests/sec per IP with burst of 100
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Connection limit: max 100 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream: PM2 Cluster ────────────────────────────────────────────────
    upstream furniva_api {
        server 127.0.0.1:5000;
        keepalive 64;              # Keep upstream connections alive
    }

    # ── Server Block ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;     # Replace with your domain in production

        # ── API Proxy ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://furniva_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Health Check Endpoint ────────────────────────────────────────────
        location = / {
            proxy_pass http://furniva_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Static files (if serving client build from Nginx) ────────────────
        # Uncomment and adjust path when deploying the React client:
        # location / {
        #     root /var/www/furniva/client/dist;
        #     try_files $uri $uri/ /index.html;
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        # }
    }
}
